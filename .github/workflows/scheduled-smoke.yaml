on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

name: Scheduled package smoke test

permissions:
  contents: read

jobs:
  vignette-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, any::pkgdown
          needs: website
      - name: Run all tests
        shell: Rscript {0}
        run: devtools::test(stop_on_failure = TRUE)
      - name: Build vignettes and site
        shell: Rscript {0}
        run: |
          devtools::build_vignettes()
          pkgdown::build_site(new_process = FALSE)
      - name: Run clone-distance resource benchmark
        run: Rscript inst/benchmarks/clone_distance_benchmark.R clone-distance-benchmark.csv
      - uses: actions/upload-artifact@v4
        with:
          name: clone-distance-benchmark
          path: clone-distance-benchmark.csv
